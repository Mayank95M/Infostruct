<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Study editor</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --paper: #fff; --ink: #1d1d1b; --ink-2: #4a4945; --ink-3: #6d6b66; --rule: #e2dfd8; --rule-2: #cfcbc2;
  --accent: #1f5f8b; --accent-soft: #e8f0f6; --warn: #8a1c1c; --warn-soft: #fbeaea; --ok: #1e6b3a; --ok-soft: #e7f3eb; --amber: #7a5a00; --amber-soft: #fff4d6;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
header.top { position: sticky; top: 0; z-index: 10; background: #1d1d1b; color: #fff; display: flex; align-items: center; gap: 14px; padding: 10px 18px; flex-wrap: wrap; }
header.top h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .01em; }
.pill { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: #3a3a37; color: #e9e7e1; white-space: nowrap; }
.pill.ok { background: #1e4d33; color: #d6f0df; }
.pill.bad { background: #6b1f1f; color: #fbe1e1; }
.pill.amber { background: #5c4600; color: #fff0c2; }
header.top .sp { flex: 1; }
header.top button { background: #fff; color: #1d1d1b; border: 0; border-radius: 7px; padding: 7px 12px; font-weight: 600; cursor: pointer; font-size: 13.5px; }
header.top button.ghost { background: transparent; color: #fff; border: 1px solid #5a5a55; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 50px); }
nav.side { border-right: 1px solid var(--rule); background: #efeee9; padding: 14px 10px; position: sticky; top: 50px; align-self: start; max-height: calc(100vh - 50px); overflow: auto; }
nav.side button { display: flex; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-size: 14px; justify-content: space-between; gap: 6px; }
nav.side button:hover { background: #e4e2dc; }
nav.side button.on { background: #1d1d1b; color: #fff; }
nav.side .sub { padding-left: 22px; font-size: 13px; }
nav.side .badge { font-size: 11.5px; background: var(--warn); color: #fff; border-radius: 999px; padding: 0 7px; line-height: 18px; }
nav.side .badge.amber { background: #b58900; }
nav.side hr { border: 0; border-top: 1px solid var(--rule); margin: 8px 4px; }
main { padding: 22px 28px 80px; max-width: 1060px; min-width: 0; }
main h2 { font-size: 22px; margin: 0 0 4px; }
main h3 { font-size: 16px; margin: 22px 0 6px; }
.lead { color: var(--ink-2); margin: 0 0 16px; max-width: 760px; }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; margin: 0 0 14px; }
.card h4 { margin: 0 0 8px; font-size: 14.5px; }
.fld { margin: 0 0 12px; }
.fld > label, .fld > .lab { display: block; font-size: 13px; color: var(--ink-3); margin: 0 0 4px; font-weight: 600; }
.fld .hint { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
input.in, select.in, textarea.in { width: 100%; padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: 7px; background: #fff; }
textarea.in { min-height: 70px; resize: vertical; line-height: 1.45; }
textarea.in.tall { min-height: 220px; }
textarea.in.mono, input.in.mono { font: 12.5px/1.45 var(--mono); }
input.in:focus, select.in:focus, textarea.in:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 14px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font-weight: 600; font-size: 13.5px; padding: 7px 12px; border-radius: 7px; border: 1px solid #3a3a37; background: #fff; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: #1d1d1b; color: #fff; border-color: #1d1d1b; }
.btn.danger { border-color: var(--warn); color: var(--warn); }
.btn.danger.primary { background: var(--warn); color: #fff; }
.btn.quiet { border-color: var(--rule-2); color: var(--ink-2); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.iconbtn { border: 1px solid var(--rule-2); background: #fff; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; display: inline-grid; place-items: center; font-size: 13px; color: var(--ink-2); }
.iconbtn:hover { background: #f1f0eb; }
.tabs2 { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin: 0 0 14px; flex-wrap: wrap; }
.tabs2 button { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--ink-3); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs2 button.on { color: var(--ink); border-bottom-color: var(--ink); }
.note { font-size: 13px; color: var(--ink-3); }
.msg { padding: 10px 12px; border-radius: 8px; font-size: 13.5px; margin: 0 0 12px; }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.bad { background: var(--warn-soft); color: var(--warn); }
.msg.amber { background: var(--amber-soft); color: var(--amber); }
.msg.info { background: var(--accent-soft); color: #164766; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; }
table.t th, table.t td { border: 1px solid var(--rule); padding: 5px 7px; text-align: left; vertical-align: top; }
table.t th { background: #faf9f6; font-weight: 600; }
table.t td.c { text-align: center; }
.scroll { overflow-x: auto; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.linkbox { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
.linkbox input { flex: 1; font: 12px var(--mono); padding: 6px 8px; border: 1px solid var(--rule-2); border-radius: 6px; background: #faf9f6; }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: #ecebe6; color: var(--ink-2); margin-left: 6px; font-weight: 600; vertical-align: 1px; }
.chip.preview { background: var(--warn-soft); color: var(--warn); }
.chip.remede { background: var(--ok-soft); color: var(--ok); }
.chip.edited { background: var(--accent-soft); color: var(--accent); }
.qcard { border: 1px solid var(--rule); border-radius: 9px; padding: 12px 14px; margin: 0 0 12px; background: #fff; }
.qcard.off { background: #f7f6f2; }
.qcard.off .qbody { opacity: .65; }
.qhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.qhead .grow { flex: 1; }
.qhead label { font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.opt-row { display: grid; grid-template-columns: 34px 1fr; gap: 6px; align-items: center; margin: 4px 0; }
.opt-row label.key { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 13px; cursor: pointer; }
.opt-row.right input.in { border-color: var(--ok); background: #f4fbf6; }
.lenbar { font-size: 11.5px; color: var(--ink-3); }
.rich { border: 1px solid var(--rule-2); border-radius: 8px; background: #fff; }
.rbar { display: flex; gap: 3px; padding: 4px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; background: #faf9f6; border-radius: 8px 8px 0 0; align-items: center; }
.rbar button { border: 1px solid transparent; background: none; border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); min-width: 28px; }
.rbar button:hover { background: #ecebe6; }
.rbar button.on { border-color: var(--rule-2); background: #fff; }
.rbar .sp { flex: 1; }
.rbar input { font: 12.5px var(--sans); padding: 3px 6px; border: 1px solid var(--rule-2); border-radius: 5px; width: 260px; }
.rarea { min-height: 70px; padding: 9px 12px; outline: none; line-height: 1.55; }
.rarea:focus { box-shadow: inset 0 0 0 2px var(--accent-soft); }
.rarea p { margin: 0 0 8px; } .rarea ul, .rarea ol { margin: 0 0 8px; padding-left: 22px; } .rarea h3 { font-size: 14.5px; margin: 8px 0 4px; }
.rarea table { border-collapse: collapse; } .rarea td, .rarea th { border: 1px solid var(--rule-2); padding: 3px 6px; }
.rcode { width: 100%; min-height: 160px; border: 0; padding: 9px 12px; font: 12.5px/1.5 var(--mono); resize: vertical; border-radius: 0 0 8px 8px; }
.elhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 16px 0 5px; }
.elhead h4 { margin: 0; font-size: 14.5px; }
.elhead .note { font-size: 12px; }
.check { display: grid; grid-template-columns: 70px 1fr auto; gap: 8px; align-items: start; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 13.5px; }
.check:first-child { border-top: 0; }
.lvl { font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; text-align: center; }
.lvl.error { background: var(--warn-soft); color: var(--warn); }
.lvl.warn { background: var(--amber-soft); color: var(--amber); }
.lvl.ok { background: var(--ok-soft); color: var(--ok); }
.stat { display: inline-block; margin: 0 14px 6px 0; font-size: 13px; }
.stat b { font-size: 18px; display: block; line-height: 1.2; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1d1d1b; color: #fff; padding: 9px 16px; border-radius: 9px; font-size: 13.5px; z-index: 60; box-shadow: 0 4px 16px rgba(0,0,0,.2); max-width: 90vw; }
.modal { position: fixed; inset: 0; background: rgba(29,29,27,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal .card { max-width: 560px; width: 100%; }
pre.code { background: #1d1d1b; color: #e9e7e1; padding: 12px; border-radius: 8px; max-height: 260px; overflow: auto; font: 11.5px/1.45 var(--mono); white-space: pre; }
ol.steps { padding-left: 20px; } ol.steps li { margin: 0 0 8px; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  nav.side { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 2px; }
  nav.side button { width: auto; }
  nav.side .sub, nav.side hr { display: none; }
  main { padding: 16px; }
  .grid2, .grid3, .grid4 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<script type="text/plain" id="gs-template">/**
 * Method information study: backend.
 * A Google Apps Script bound to a Google Sheet. It keeps the study content (a draft and every
 * published version), assigns each participant a condition, saves their answers as they go,
 * and emails you when someone finishes.
 *
 * Generated by the study editor on __GENERATED__.
 * Setup: in your Sheet choose Extensions > Apps Script, replace the sample code with this file
 * and SAVE it; then Deploy > New deployment > type: Web app, Execute as: Me,
 * Who has access: Anyone. Copy the web app URL with its Copy button and paste it into the editor.
 * Check: opening that URL in a private window should show {"ok":true,"app":"IS study",...}.
 * After changing this script: Deploy > Manage deployments > pencil > Version: New version.
 */
var ADMIN_KEY = '__ADMIN_KEY__';        // private: lets the editor read and change the study
var NOTIFY_EMAIL = '__NOTIFY_EMAIL__';  // where completion emails go ('' for none)
var CHUNK = 40000;                      // characters per cell when storing JSON (a cell holds 50,000)
var ACTIVE_MINUTES = 120;               // an unfinished participant counts toward balancing for this long

var HEADERS = {
  Content: ['version', 'status', 'saved', 'note', 'json_parts', 'json'],
  Participants: ['pid', 'token', 'group', 'condition', 'pilot', 'version', 'status', 'step', 'started', 'updated', 'submitted', 'minutes', 'seq', 'json_parts', 'json']
};
// Participants columns
var P_PID = 0, P_TOKEN = 1, P_GROUP = 2, P_COND = 3, P_PILOT = 4, P_VER = 5, P_STATUS = 6, P_STEP = 7,
  P_STARTED = 8, P_UPDATED = 9, P_SUBMITTED = 10, P_MIN = 11, P_SEQ = 12, P_JSON = 13;

function setup() {
  Object.keys(HEADERS).forEach(function (n) { sheet_(n); });
  Logger.log('Ready. Sheet: ' + SpreadsheetApp.getActiveSpreadsheet().getUrl() + ' | emails left today: ' + MailApp.getRemainingDailyQuota());
}

function doGet(e) {
  var p = (e && e.parameter) || {};
  if (p.action === 'content') return json_(safe_(function () { return content_(p); }));
  return json_({ ok: true, app: 'IS study', version: 2, sheet: !!SpreadsheetApp.getActiveSpreadsheet() });
}

function doPost(e) {
  var req;
  try { req = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'Bad request' }); }
  return json_(safe_(function () { return route_(req); }));
}

function safe_(fn) {
  try { var r = fn() || {}; r.ok = true; return r; }
  catch (err) {
    var m = String((err && err.message) || err), out = { ok: false, error: m };
    if (m.indexOf('BUSY: ') === 0) { out.busy = true; out.error = m.slice(6); }       // worth retrying
    if (m.indexOf('CONFLICT: ') === 0) { out.conflict = true; out.error = m.slice(10); }
    return out;
  }
}
function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

var ADMIN = { ping: 1, getDraft: 1, saveDraft: 1, publish: 1, versions: 1, getVersion: 1, setStatus: 1,
  participants: 1, responses: 1, deleteParticipant: 1, testEmail: 1 };

function route_(r) {
  if (ADMIN[r.action] && (!ADMIN_KEY || ADMIN_KEY.indexOf('__') === 0 || r.key !== ADMIN_KEY)) throw new Error('The admin key does not match this backend.');
  var out;
  switch (r.action) {
    case 'ping':
      var ss = SpreadsheetApp.getActiveSpreadsheet();
      Object.keys(HEADERS).forEach(function (n) { sheet_(n); });
      return { sheet: ss.getName(), url: ss.getUrl(), email: NOTIFY_EMAIL, quota: MailApp.getRemainingDailyQuota(), status: status_(), published: latestVersion_() };
    case 'getDraft': return getDraft_();
    case 'saveDraft': return locked_(function () { return saveDraft_(r.content, r.base, r.force); });
    case 'publish': return locked_(function () { return publish_(r.content, r.note); });
    case 'versions': return { versions: versions_() };
    case 'getVersion': var c = getVersion_(Number(r.v)); if (!c) throw new Error('No such version.'); return { content: c };
    case 'setStatus':
      if (r.status !== 'open' && r.status !== 'closed') throw new Error('Status must be open or closed.');
      PropertiesService.getScriptProperties().setProperty('STATUS', r.status);
      return { status: r.status };
    case 'participants': return { participants: participants_(false) };
    case 'responses': return { participants: participants_(true) };
    case 'deleteParticipant': return locked_(function () { deleteParticipant_(String(r.pid || '')); return {}; });
    case 'testEmail':
      if (!NOTIFY_EMAIL) throw new Error('No email address is set in the script.');
      MailApp.sendEmail(NOTIFY_EMAIL, 'IS study: test email', 'Your study backend can send email. Completion emails will arrive like this.', { name: 'IS study' });
      return {};
    case 'content': return content_(r);
    case 'join': return locked_(function () { return join_(r); });
    case 'hello': return hello_(r);
    case 'save': return locked_(function () { return save_(r); });
    case 'submit':
      out = locked_(function () { return submit_(r); });
      if (out.mail) notify_(out.mail);
      delete out.mail;
      return out;
    case 'withdraw': return locked_(function () { withdraw_(r); return {}; });
  }
  throw new Error('Unknown action: ' + r.action);
}

/* ---------- helpers ---------- */
function locked_(fn) {
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(30000)) throw new Error('BUSY: The study server is busy. Please try again in a moment.');
  try { return fn(); }
  finally { SpreadsheetApp.flush(); lock.releaseLock(); }   // Sheets batches writes: flush before the next request reads
}
function sheet_(name) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (!ss) throw new Error('This script is not attached to a Google Sheet. Open your Sheet, choose Extensions > Apps Script, and paste the script there.');
  var sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    var h = HEADERS[name];
    if (h) { ensure_(sh, 1, h.length); sh.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold'); sh.setFrozenRows(1); }
  }
  return sh;
}
function ensure_(sh, row, col) {   // a new tab is 1,000 rows by 26 columns; writing outside it fails
  var mr = sh.getMaxRows(), mc = sh.getMaxColumns();
  if (row > mr) sh.insertRowsAfter(mr, row - mr + 200);
  if (col > mc) sh.insertColumnsAfter(mc, col - mc + 10);
}
function table_(name) {
  var sh = sheet_(name), last = sh.getLastRow(), cols = sh.getLastColumn();
  var data = last > 1 && cols > 0 ? sh.getRange(2, 1, last - 1, cols).getValues() : [];
  return { sh: sh, data: data };
}
function head_(name, width) {   // the first `width` columns of every data row, without the JSON parts
  var sh = sheet_(name), last = sh.getLastRow();
  ensure_(sh, 1, width);
  return { sh: sh, data: last > 1 ? sh.getRange(2, 1, last - 1, width).getValues() : [] };
}
function rowAt_(sh, i) { return sh.getRange(i + 2, 1, 1, Math.max(1, sh.getLastColumn())).getValues()[0]; }
function find_(data, test) { for (var i = 0; i < data.length; i++) if (test(data[i])) return i; return -1; }
function pack_(obj) {
  var s = JSON.stringify(obj), parts = [];
  for (var i = 0; i < s.length; i += CHUNK) parts.push('~' + s.substr(i, CHUNK));
  return parts;
}
function unpack_(row, at) {
  var n = Number(row[at]) || 0, s = '';
  for (var i = 1; i <= n; i++) s += String(row[at + i] || '').substr(1);
  if (!s) return null;
  try { return JSON.parse(s); } catch (err) { return null; }
}
function writeRow_(sh, rowIndex, fixed, parts) {
  var vals = fixed.concat([parts.length]).concat(parts);
  var width = Math.max(sh.getLastColumn(), vals.length);
  while (vals.length < width) vals.push('');
  ensure_(sh, rowIndex, vals.length);
  sh.getRange(rowIndex, 1, 1, vals.length).setValues([vals]);
}
function iso_(v) { return v instanceof Date ? v.toISOString() : (v || ''); }
function cell_(v) {   // for the readable Data sheet and short fields: text stays text
  if (v === null || v === undefined) return '';
  if (typeof v === 'number' || typeof v === 'boolean') return v;
  if (Object.prototype.toString.call(v) === '[object Array]') v = v.join('; ');
  var s = String(v);
  if (s.length > 45000) s = s.slice(0, 45000) + '...';
  return s === '' ? '' : "'" + s;   // no formulas, and no "1-2" turning into a date
}
function status_() { return PropertiesService.getScriptProperties().getProperty('STATUS') || 'open'; }
function prop_(k) { return PropertiesService.getScriptProperties().getProperty(k); }
function setProp_(k, v) { PropertiesService.getScriptProperties().setProperty(k, v); }

/* ---------- content ---------- */
// Content columns: 0 version (0 = draft), 1 status, 2 saved, 3 note, 4 json_parts, 5+ json
function latestVersion_() {
  var t = head_('Content', 2), v = 0;
  t.data.forEach(function (r) { if (r[1] === 'published' && Number(r[0]) > v) v = Number(r[0]); });
  return v;
}
function getVersion_(v) {
  var t = head_('Content', 2);
  var i = find_(t.data, function (r) { return Number(r[0]) === v && (v === 0 || r[1] === 'published'); });
  return i < 0 ? null : unpack_(rowAt_(t.sh, i), 4);
}
function check_(c) {
  if (!c || typeof c !== 'object' || !c.methods || !c.pairs || !c.groups) throw new Error('This is not study content.');
  var s = JSON.stringify(c);
  if (s.length > 2000000) throw new Error('The study content is too large (over 2 MB).');
}
function getDraft_() {
  var t = head_('Content', 3);
  var i = find_(t.data, function (r) { return Number(r[0]) === 0; });
  var latest = latestVersion_();
  if (i >= 0) return { draft: unpack_(rowAt_(t.sh, i), 4), saved: iso_(t.data[i][2]), published: latest };
  return { draft: latest ? getVersion_(latest) : null, saved: '', published: latest };
}
function saveDraft_(c, base, force) {
  check_(c);
  var t = head_('Content', 3), now = new Date();
  var i = find_(t.data, function (r) { return Number(r[0]) === 0; });
  var cur = i >= 0 ? iso_(t.data[i][2]) : '';
  if (!force && base !== undefined && base !== null && cur && cur !== base) throw new Error('CONFLICT: The draft in the Sheet was saved from another tab or browser at ' + cur + '.');
  writeRow_(t.sh, i >= 0 ? i + 2 : t.sh.getLastRow() + 1, [0, 'draft', now, ''], pack_(c));
  return { saved: now.toISOString() };
}
function publish_(c, note) {
  if (!c) { var d = getDraft_(); c = d.draft; }
  check_(c);
  var v = latestVersion_() + 1, now = new Date();
  c.version = v; c.publishedAt = now.toISOString();
  var sh = sheet_('Content');
  writeRow_(sh, sh.getLastRow() + 1, [v, 'published', now, cell_(note || '')], pack_(c));
  // a small summary for joining, so a busy moment does not have to read the whole content
  setProp_('META', JSON.stringify({ version: v, groups: (c.groups || []).map(function (g) { return { id: g.id, max: Number(g.max) || 0 }; }), pairs: c.pairs || [] }));
  var r = saveDraft_(c, null, true);
  return { version: v, saved: r.saved };
}
function meta_(latest) {
  var m = null;
  try { m = JSON.parse(prop_('META') || 'null'); } catch (err) { m = null; }
  if (m && m.version === latest) return m;
  var c = getVersion_(latest) || {};
  return { version: latest, groups: (c.groups || []).map(function (g) { return { id: g.id, max: Number(g.max) || 0 }; }), pairs: c.pairs || [] };
}
function versions_() {
  return head_('Content', 4).data.filter(function (r) { return r[1] === 'published'; })
    .map(function (r) { return { version: Number(r[0]), saved: iso_(r[2]), note: r[3] }; })

  /* =============================== Checks =============================== */
  const VAR = /^[A-Za-z][A-Za-z0-9_]*$/;
  function runChecks() {
    const c = D(), out = [];
    const add = (level, text, go) => out.push({ level, text, go });
    if (!c.groups || !c.groups.length) add('error', 'There are no groups.');
    if (!c.pairs.length) add('error', 'There are no pairs, so nobody can be given a condition.', ['pairs']);
    const used = new Set();
    c.pairs.forEach(p => {
      if (p.methods.length !== 2 || p.methods.some(x => !x)) add('error', 'Pair ' + p.id + ' needs two methods.', ['pairs']);
      p.methods.forEach(x => { if (x && !c.methods.some(m => m.id === x)) add('error', 'Pair ' + p.id + ' refers to a method that no longer exists.', ['pairs']); });
      if (p.methods[0] && p.methods[0] === p.methods[1]) add('error', 'Pair ' + p.id + ' has the same method twice.', ['pairs']);
      p.methods.forEach(x => { if (used.has(x) && x) add('warn', 'A method appears in more than one pair.', ['pairs']); used.add(x); });
    });
    const ids = new Set();
    c.methods.forEach(m => {
      const go = ['methods', m.id];
      if (ids.has(m.id)) add('error', 'Two methods share the ID “' + m.id + '”.', go); ids.add(m.id);
      if (!VAR.test(m.id) && !/^[0-9a-z_-]+$/i.test(m.id)) add('error', m.name + ': the ID may use only letters, digits, - and _.', go);
      if (!used.has(m.id)) { add('warn', (m.name || m.id) + ' is not in any pair, so participants do not see it.', ['pairs']); return; }
      if (m.source === 'preview') add('warn', m.name + ' still has the paraphrased preview text (participants see a red banner).', go.concat('details'));
      const empty = c.elements.filter(e => !plain((m.elements || {})[e.name]) && !/<img/i.test((m.elements || {})[e.name] || ''));
      if (empty.length) add('error', m.name + ': empty element' + (empty.length > 1 ? 's' : '') + ' ' + empty.map(e => e.name).join(', ') + '.', go.concat('content'));
      if (!plain(m.input)) add('error', m.name + ': the task input is empty.', go.concat('task'));
      const on = m.questions.filter(q => q.on);
      if (!on.length) add('error', m.name + ': no questions are in use.', go.concat('questions'));
      on.forEach(q => {
        if (!q.stem.trim()) add('error', m.name + ' ' + q.id + ': the question is empty.', go.concat('questions'));
        if (q.options.length !== 4 || q.options.some(o => !String(o).trim())) add('error', m.name + ' ' + q.id + ': every question needs four options.', go.concat('questions'));
        if (new Set(q.options.map(o => String(o).trim().toLowerCase())).size < q.options.length) add('error', m.name + ' ' + q.id + ': two options are the same.', go.concat('questions'));
        if (!/^[ABCD]$/.test(q.key)) add('error', m.name + ' ' + q.id + ': no correct answer is chosen.', go.concat('questions'));
        const L = q.options.map(o => String(o).length), k = 'ABCD'.indexOf(q.key);
        if (k >= 0 && L[k] === Math.max(...L) && L.filter(x => x === L[k]).length === 1 && Math.max(...L) / Math.max(1, Math.min(...L)) > 1.25) add('warn', m.name + ' ' + q.id + ': the correct answer is clearly the longest option, a cue test-takers use.', go.concat('questions'));
        if (!q.core) add('warn', m.name + ' ' + q.id + ' is in use but not answerable from the core page: keep it out of the comparison of understanding.', go.concat('questions'));
      });
      if (new Set(on.map(q => q.key)).size < on.length && on.length <= 4) add('warn', m.name + ': two questions in use share the same correct letter.', go.concat('questions'));
      const r = m.rubric || {};
      if (!r.mechanism || !(r.procedure || []).length || !r.output) add('warn', m.name + ': the rubric is incomplete.', go.concat('rubric'));
    });
    // answer letters across everything a participant sees
    const all = c.methods.filter(m => used.has(m.id)).flatMap(m => m.questions.filter(q => q.on).map(q => q.key));
    if (all.length >= 8) {
      const cnt = 'ABCD'.split('').map(L => all.filter(x => x === L).length);
      if (Math.max(...cnt) - Math.min(...cnt) > Math.max(2, Math.round(all.length * 0.15))) add('warn', 'Correct answers are unevenly spread over A–D (' + 'ABCD'.split('').map((L, i) => L + ' ' + cnt[i]).join(', ') + ').', ['checks']);
    }
    c.pairs.forEach(p => {
      const seq = p.methods.flatMap(id => ((c.methods.find(m => m.id === id) || {}).questions || []).filter(q => q.on).map(q => q.key));
      for (let i = 0; i + 2 < seq.length; i++) if (seq[i] === seq[i + 1] && seq[i] === seq[i + 2]) { add('warn', 'Pair ' + p.id + ': three questions in a row have the same correct letter.', ['pairs']); break; }
    });
    // questionnaires
    ['about', 'views'].forEach(w => {
      const seen = new Set();
      c[w].forEach((it, i) => {
        if (it.type === 'note') return;
        const label = (w === 'about' ? 'About you' : 'Your views') + ' #' + (i + 1);
        if (!VAR.test(it.var || '')) add('error', label + ': the variable name must start with a letter and use only letters, digits and _.', [w]);
        const vs = it.type === 'cvr' ? c.elements.map((e, j) => it.var + String(j + 1).padStart(2, '0')).concat(it.attn ? [it.attn.var] : []) : it.type === 'methodgrid' ? c.methods.map(m => it.var + '_' + m.id) : [it.var];
        vs.forEach(v => { if (seen.has(v)) add('error', label + ': the variable “' + v + '” is used twice.', [w]); seen.add(v); });
        if ((it.type === 'single' || it.type === 'multi') && (it.options || []).length < 2) add('error', label + ': needs at least two options.', [w]);
        if ((it.type === 'likert' || it.type === 'cvr' || it.type === 'methodgrid') && !(it.points >= 2 && it.points <= 11)) add('error', label + ': points must be between 2 and 11.', [w]);
        if (it.type === 'cvr' && it.attn && !(it.attn.value >= 1 && it.attn.value <= it.points)) add('error', label + ': the attention check’s answer is outside the scale.', [w]);
      });
    });
    if (!c.views.some(it => it.type === 'cvr')) add('warn', 'Your views has no element-rating grid, so there will be no content validity ratios.', ['views']);
    const P = E.publishedContent;
    if (P) {
      if (JSON.stringify(P.elements.map(e => e.name)) !== JSON.stringify(c.elements.map(e => e.name))) add('warn', 'The elements differ from the published version: once data collection has started, this mixes up the element ratings (e01, e02, …) across versions.', ['elements']);
      if (JSON.stringify(P.pairs) !== JSON.stringify(c.pairs)) add('warn', 'The pairs differ from the published version: once data collection has started, this changes what each condition means and upsets the balancing.', ['pairs']);
    }
    if (!c.texts.checks || !c.texts.checks.length) add('warn', 'The consent page has no tick boxes.', ['texts']);
    return out;
  }

      box.append(h('div', { class: 'row', style: 'margin-bottom:8px' }, sel('pilot', [['main', 'Main study'], ['pilot', 'Pilots'], ['all', 'Everyone']]), sel('status', [['', 'Any status'], ['completed', 'Finished'], ['in progress', 'In progress'], ['started', 'Started'], ['withdrawn', 'Withdrawn']]),
        h('button', { class: 'btn sm quiet', type: 'button', onclick: () => render() }, 'Refresh')),
        h('div', { class: 'scroll' }, h('table', { class: 't' }, h('thead', null, h('tr', null, ['ID', 'Group', 'Condition', 'Pilot', 'Version', 'Status', 'Step', 'Started', 'Minutes', ''].map(x => h('th', null, x)))), tbody)));

  }
  async function exportData(btn, kind) {
    btn.disabled = true; const label = btn.textContent; btn.textContent = 'Preparing…';
    try {
      const r = await api('responses');
      const versions = {};
      for (const v of new Set(r.participants.map(p => p.version).filter(Boolean))) versions[v] = (await api('getVersion', { v })).content;
      if (kind === 'json') download('IS_study_raw_' + stamp() + '.json', JSON.stringify({ exported: new Date().toISOString(), participants: r.participants, versions }, null, 1), 'application/json');
      else download('IS_study_data_' + stamp() + '.xlsx', XLSX.build(dataSheets(r.participants, versions)));
      toast('Downloaded ' + r.participants.length + ' participants.');
    } catch (e) { toast(e.message, 6000); }
    btn.disabled = false; btn.textContent = label;
  }
  function itemVars(c, list) {
    const out = [];
    (list || []).forEach(it => {
      if (it.type === 'note') return;
      if (it.type === 'cvr') { c.elements.forEach((e, j) => out.push([it.var + String(j + 1).padStart(2, '0'), 'Rating of element ' + (j + 1) + ', ' + e.name + ' (1-' + it.points + ')'])); if (it.attn) out.push([it.attn.var, 'Attention check (correct: ' + it.attn.value + ')']); return; }
      if (it.type === 'methodgrid') { c.methods.forEach(m => out.push([it.var + '_' + m.id, it.t + ' ' + m.name + ' (1-' + it.points + ')'])); return; }
      out.push([it.var, it.t]);
      if (it.other) out.push([it.var + '_other', it.t + ' (Other, text)']);
    });
    return out;
  }
  function dataSheets(parts, versions) {
    const vs = Object.keys(versions).map(Number);
    const latest = versions[Math.max(...vs)] || D();
    const cOf = p => versions[p.version] || latest;
    const sec = ms => ms == null ? '' : Math.round(ms / 1000);
    const aboutVars = itemVars(latest, latest.about), viewVars = itemVars(latest, latest.views);
    const extra = (key, known) => { const s = new Set(known.map(x => x[0])); const add = []; parts.forEach(p => Object.keys((p.state || {})[key] || {}).forEach(k => { if (!s.has(k)) { s.add(k); add.push([k, '']); } })); return known.concat(add); };
    const AV = extra('about', aboutVars), VV = extra('views', viewVars);
    const val = v => Array.isArray(v) ? v.join('; ') : v == null ? '' : v;
    const P = [['pid', 'group', 'condition', 'pilot', 'version', 'status', 'step', 'started', 'submitted', 'minutes'].concat(AV.map(x => 'about_' + x[0]), VV.map(x => 'views_' + x[0]), ['screen_w', 'screen_h', 'touch'])];
    const B = [['pid', 'group', 'condition', 'pilot', 'version', 'status', 'block', 'method', 'method_name', 'phase', 'pair', 'position_in_pair', 'format', 'is_first', 'questions', 'correct', 'core_questions', 'core_correct',
      'ease', 'work', 'conf', 'useful', 'plan', 'mistake', 'teachuse', 'read_s', 'work_s', 'teach_s', 'hidden_s', 'familiarity']];
    const I = [['pid', 'group', 'condition', 'pilot', 'version', 'status', 'block', 'method', 'format', 'item', 'qid', 'kind', 'core', 'answer', 'key', 'correct']];
    parts.forEach(p => {
      const s = p.state || {}, c = cOf(p), about = s.about || {}, views = s.views || {}, env = s.env || {};
      P.push([p.pid, p.group, p.condition, p.pilot, p.version, p.status, p.step, p.started, p.submitted, p.minutes].concat(AV.map(x => val(about[x[0]])), VV.map(x => val(views[x[0]])), [val(env.w), val(env.h), env.touch ? 1 : env.touch === false ? 0 : '']));
      const blocks = s.blocks || [];
      const isFirst = blocks[0] ? (blocks[0].format === 'is' ? 1 : 0) : '';
      blocks.forEach((b, k) => {
        const m = c.methods.find(x => x.id === b.method) || { questions: [], name: b.method };
        const pr = c.pairs.find(x => x.methods.includes(b.method)) || { id: '', methods: [] };
        const qs = m.questions.filter(q => q.on), ans = b.answers || {};
        const right = qs.filter(q => ans[q.id] && ans[q.id] === q.key), core = qs.filter(q => q.core);
        const t = b.t || {};
        B.push([p.pid, p.group, p.condition, p.pilot, p.version, p.status, k + 1, b.method, m.name, m.phase || '', pr.id, pr.methods.indexOf(b.method) + 1, b.format, isFirst,
          qs.length, right.length, core.length, core.filter(q => ans[q.id] === q.key).length, val(b.ease), val(b.work), val(b.conf), val(b.useful), val(b.plan), val(b.mistake), val(b.teachuse),
          t.start && t.a ? sec(t.a - t.start) : '', t.a && t.b ? sec(t.b - t.a) : '', t.b && t.c ? sec(t.c - t.b) : '', b.hidden_ms ? sec(b.hidden_ms) : 0, val(about['fam_' + b.method])]);
        qs.forEach(q => I.push([p.pid, p.group, p.condition, p.pilot, p.version, p.status, k + 1, b.method, b.format, b.method + '_' + q.id, q.id, q.kind, q.core ? 1 : 0, ans[q.id] || '', q.key, ans[q.id] === q.key ? 1 : 0]));
      });
    });
    const M = [['id', 'name', 'phase', 'pair', 'position_in_pair', 'source', 'imported_at', 'sha256']].concat(latest.methods.map(m => { const pr = latest.pairs.find(x => x.methods.includes(m.id)) || { id: '', methods: [] }; return [m.id, m.name, m.phase || '', pr.id, pr.methods.indexOf(m.id) + 1 || '', m.source || '', m.importedAt || '', m.sha256 || '']; }));
    const R = [['method', 'method_name', 'mechanism', 'procedure', 'output', 'mistakes', 'checks']].concat(latest.methods.map(m => { const r = m.rubric || {}; return [m.id, m.name, r.mechanism || '', (r.procedure || []).join('\n'), r.output || '', r.mistakes || '', r.checks || '']; }));
    const EL = [['n', 'element', 'description', 'on_core_page']].concat(latest.elements.map((e, i) => [i + 1, e.name, e.desc, latest.core.some(s => s.elements.includes(e.name)) ? 1 : 0]));
    const cvrItem = (latest.views || []).find(it => it.type === 'cvr' && it.attn);
    const CR = [['criterion', 'value']].concat(Object.entries(latest.criteria || {}).map(([k, v]) => [k, Array.isArray(v) ? v.join('; ') : v]),
      cvrItem ? [['attention_variable', cvrItem.attn.var], ['attention_value', cvrItem.attn.value]] : []);
    const V = [['version', 'published', 'methods_with_preview_text']].concat(vs.sort((a, b) => a - b).map(v => [v, versions[v].publishedAt || '', versions[v].methods.filter(m => m.source === 'preview').map(m => m.name).join('; ')]));
    const CB = [['sheet', 'column', 'meaning']].concat(
      [['Participants', 'pid', 'Participant ID (group, then P for pilots, then a number)'], ['Participants', 'condition', 'Pair letter, then 1 = first method on the IS page, 2 = second method on the IS page'], ['Participants', 'pilot', 'Empty for the main study; 1 = pilot; nopage = no-page pilot'],
        ['Participants', 'version', 'Content version the participant saw'], ['Participants', 'minutes', 'Minutes from consent to submitting'],
        ['Blocks', 'format', 'is = IS page (all elements); core = core page; none = no page (pilot)'], ['Blocks', 'is_first', '1 if the IS page came first'], ['Blocks', 'correct', 'Questions answered correctly, of “questions”'],
        ['Blocks', 'core_correct', 'Correct answers among questions answerable from the core page'], ['Blocks', 'read_s', 'Seconds from opening the method to finishing the questions'], ['Blocks', 'work_s', 'Seconds on the task'], ['Blocks', 'teach_s', 'Seconds on the teaching part'],
        ['Blocks', 'hidden_s', 'Seconds the tab was hidden during this method (looking elsewhere)'], ['Blocks', 'familiarity', 'Prior familiarity with this method (1-5)'], ['Items', 'correct', '1 if the answer matches the key of the version the participant saw']]
        .concat(AV.map(x => ['Participants', 'about_' + x[0], x[1]]), VV.map(x => ['Participants', 'views_' + x[0], x[1]])));
    const W = [['warning']];
    const elSets = new Set(vs.map(v => JSON.stringify(versions[v].elements.map(e => e.name))));
    if (elSets.size > 1) W.push(['The published versions in this file list different elements, so views_e01, views_e02 … do not mean the same element for everyone. Check the Versions sheet before computing content validity ratios.']);
    const prSets = new Set(vs.map(v => JSON.stringify(versions[v].pairs)));
    if (prSets.size > 1) W.push(['The published versions in this file have different pairs, so a condition code may not mean the same methods for everyone.']);
    return [{ name: 'Participants', rows: P }, { name: 'Blocks', rows: B }, { name: 'Items', rows: I }, { name: 'Methods', rows: M }, { name: 'Rubric', rows: R }, { name: 'Elements', rows: EL }, { name: 'Criteria', rows: CR }, { name: 'Versions', rows: V }, { name: 'Codebook', rows: CB }].concat(W.length > 1 ? [{ name: 'Warnings', rows: W }] : []);
  }
  function expertSheet() {
    const c = D();
    const rows = [['Method', 'Phase', 'Question', 'Kind', 'Answerable from the core page (author)', 'Question text', 'A', 'B', 'C', 'D', 'Key', 'Source on the page', 'Expert 1: key is correct (Y/N)', 'Expert 2: key is correct (Y/N)', 'Expert 1: answerable from the core page (Y/N)', 'Expert 2: answerable from the core page (Y/N)', 'Notes']];
    c.pairs.forEach(p => p.methods.forEach(id => { const m = c.methods.find(x => x.id === id); if (!m) return; m.questions.filter(q => q.on).forEach(q => rows.push([m.name, m.phase || '', q.id, q.kind, q.core ? 'yes' : 'no', q.stem].concat(q.options, [q.key, q.source || '', '', '', '', '', '']))); }));
    download('IS_study_expert_check_' + stamp() + '.xlsx', XLSX.build([{ name: 'Answer key', rows, widths: [20, 18, 9, 11, 12, 50, 30, 30, 30, 30, 5, 24, 12, 12, 14, 14, 30] }]));
  }

  /* =============================== a small .xlsx writer =============================== */
  const XLSX = (() => {
    const T = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; T[n] = c >>> 0; }
    const crc = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = T[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
    const enc = new TextEncoder();
    function zip(files) {
      const parts = [], central = []; let off = 0;
      files.forEach(f => {
        const name = enc.encode(f.name), data = f.data, c = crc(data);
        const lh = new DataView(new ArrayBuffer(30));
        lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(8, 0, true); lh.setUint32(14, c, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
        parts.push(new Uint8Array(lh.buffer), name, data);
        const ch = new DataView(new ArrayBuffer(46));
        ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint32(16, c, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
        central.push(new Uint8Array(ch.buffer), name);
        off += 30 + name.length + data.length;
      });
      const size = central.reduce((s, a) => s + a.length, 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, size, true); end.setUint32(16, off, true);
      return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    }
    const x = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const col = n => { let s = ''; n++; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
    function sheet(rows, widths) {
      const body = rows.map((r, i) => '<row r="' + (i + 1) + '">' + r.map((v, j) => {
        const ref = col(j) + (i + 1), st = i === 0 ? ' s="1"' : '';
        if (v === '' || v == null) return '';
        if (typeof v === 'number' && isFinite(v)) return '<c r="' + ref + '"' + st + '><v>' + v + '</v></c>';
        if (typeof v === 'boolean') return '<c r="' + ref + '"' + st + ' t="b"><v>' + (v ? 1 : 0) + '</v></c>';
        let s = String(v); if (s.length > 32000) s = s.slice(0, 32000);
        return '<c r="' + ref + '"' + st + ' t="inlineStr"><is><t xml:space="preserve">' + x(s) + '</t></is></c>';
      }).join('') + '</row>').join('');
      const cols = widths ? '<cols>' + widths.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>' : '';
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' + cols + '<sheetData>' + body + '</sheetData></worksheet>';
    }
    function build(sheets) {
      const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n', files = [], put = (name, s) => files.push({ name, data: enc.encode(s) });
      put('[Content_Types].xml', X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + sheets.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>');
      put('_rels/.rels', X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
      put('xl/workbook.xml', X + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + sheets.map((s, i) => '<sheet name="' + x(s.name.slice(0, 31)) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets></workbook>');
      put('xl/_rels/workbook.xml.rels', X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + sheets.map((_, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
      put('xl/styles.xml', X + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>');
      sheets.forEach((s, i) => put('xl/worksheets/sheet' + (i + 1) + '.xml', sheet(s.rows, s.widths)));
      return zip(files);
    }
    return { build };
  })();

  /* =============================== header buttons and start =============================== */
  $('#pv-btn').addEventListener('click', () => { if (!E.draft) return toast('Load a study first.'); preview({ g: D().groups[0].id }); });
  $('#pub-btn').addEventListener('click', () => { if (!E.draft) return; E.section = 'publish'; render(); });
  window.addEventListener('beforeunload', e => { if (E.dirty && E.conn) { pushDraft(); e.preventDefault(); e.returnValue = ''; } });
  window.__editor = { E, runChecks, parseRemede, dataSheets, clean };   // used by the automated tests
  (async function start() {
    render();
    if (E.backend && E.key) {
      try { await connect(); } catch (e) { toast('Could not connect: ' + e.message, 6000); }
      render();
    }
  })();
})();
